[package]
name = "luma_engine"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Layout and SDF render engine for Luma."
repository = "https://github.com/univiseditor/bevy_luma"
homepage = "https://github.com/univiseditor/bevy_luma"

[features]
default = []
example_bloom = ["bevy/bevy_post_process"]

[dependencies]
bevy = { workspace = true }
luma_layout = { path = "../luma_layout", version = "0.1.0", features = ["bevy_reflect"] }
luma_style = { path = "../luma_style", version = "0.1.0" }
parley = { workspace = true }
swash = { workspace = true }
unicode-bidi = "0.3"
unicode-segmentation = "1.12"
bytemuck = { version = "1", features = ["derive"] }
