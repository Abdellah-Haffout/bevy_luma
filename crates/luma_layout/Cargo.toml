[package]
name = "luma_layout"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Pure, standalone, high-performance layout engine supporting CSS Grid, Flexbox, and Radial layouts for Luma."
repository = "https://github.com/Abdellah-Haffout/bevy_luma"
homepage = "https://github.com/Abdellah-Haffout/bevy_luma"

[features]
default = ["std"]
std = []
bevy_reflect = ["dep:bevy_reflect"]

[dependencies]
glam = { version = "0.33", default-features = false, features = ["std"] }
bevy_reflect = { version = "0.20.0", default-features = false, optional = true, features = ["glam"] }
